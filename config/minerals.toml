# UK critical and growth minerals, with their HS (CN8) code definitions
#
# Membership: Annex 1 of the Critical Minerals technical annex (34 critical, 23 growth minerals)
# Codes:      Annex 5, Table 3 of the same annex ("HS code definition of critical and growth minerals"),
#             transcribed as published. Codes are strings so they match Cn8Code in the HMRC lookup.
#
# Scope note: Annex 5 includes semi-manufactured products (e.g. copper wire, aluminium sheet,
# rare earth magnets), so it is broader than the CMIC 2024 Criticality Assessment, Appendix 9.
#
# Codes listed under more than one mineral (watch for double counting):
#   71104100, 71104900  iridium and ruthenium (identical code lists)
#   26190020            iron and manganese
#   28332930            cobalt and titanium

[source]
title = "Critical Minerals technical annex (UK Critical Minerals Strategy)"
publisher = "Department for Business and Trade"
url = "https://www.gov.uk/government/publications/uk-critical-minerals-strategy/critical-minerals-technical-annex"
version = "2026-01-23"   # 'Updated' date shown on the page
retrieved = "2026-10-15"
licence = "Open Government Licence v3.0"

